services:
  inky-immich:
    container_name: inky-immich
    build: .
    ports:
      # Change this IP to the Docker host's local network address.
      - "${HOST_IP:?Set HOST_IP to Docker host LAN IP}:18765:8000"
    environment:
      IMMICH_URL: ${IMMICH_URL:?Set IMMICH_URL in your environment or .env file}
      IMMICH_API_KEY: ${IMMICH_API_KEY:?Set IMMICH_API_KEY in your environment or .env file}
      ORIENTATION: ${ORIENTATION:-}
      PEOPLE: ${PEOPLE:-}
      INCLUDE_TAGS: ${INCLUDE_TAGS:-}
      EXCLUDE_TAGS: ${EXCLUDE_TAGS:-}
      EXCLUDE_DARKER_IMAGES: ${EXCLUDE_DARKER_IMAGES:-}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=5).close()"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    restart: unless-stopped
